<script>
/* Android app bridge: PDFs open from the copies bundled in the app; Back walks the in-app view history. */
(function(){
 if(!window.AndroidApp)return;
 document.documentElement.classList.add('android-app');
 window.saveFile=function(path,filename,btn){try{AndroidApp.pdf(String(path),String(filename||path))}catch(e){if(typeof toast==='function')toast('Could not open the PDF')}};
 var st=[],cur=location.hash,lock=false,rs=history.replaceState.bind(history);
 function push(h){if(lock||h===cur)return;if(cur&&cur!=='#')st.push(cur);if(st.length>80)st.shift();cur=h}
 history.replaceState=function(s,t,u){if(typeof u==='string'&&u.charAt(0)==='#')push(u);return rs(s,t,u)};
 addEventListener('hashchange',function(){push(location.hash)});
 window.__appBack=function(){
  var open=document.querySelector('dialog[open]');if(open){try{open.close()}catch(e){}return true}
  if(!st.length)return false;var h=st.pop();lock=true;cur=h;rs(null,'',h);
  try{dispatchEvent(new HashChangeEvent('hashchange'))}finally{lock=false}return true};
 window.__appToast=function(m){if(typeof toast==='function')toast(m)};
 /* live update: the app downloaded newer site content in the background (Updater.java) */
 window.__appUpdated=function(){
  if(document.getElementById('appUpd'))return;
  var b=document.createElement('div');b.id='appUpd';b.setAttribute('role','status');
  b.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:200;display:flex;gap:12px;align-items:center;justify-content:space-between;background:#0f1115;color:#fff;border-radius:12px;padding:10px 10px 10px 14px;font:500 13.5px Inter,system-ui,sans-serif;box-shadow:0 12px 30px -12px rgba(0,0,0,.55)';
  var t=document.createElement('span');t.textContent='New answers and PDFs downloaded.';b.appendChild(t);
  var r=document.createElement('button');r.type='button';r.textContent='Reload';
  r.style.cssText='flex:none;border:0;border-radius:999px;background:#fff;color:#0f1115;font:600 13px Inter,system-ui,sans-serif;padding:8px 16px';
  r.onclick=function(){try{AndroidApp.reload(location.hash||'')}catch(e){location.reload()}};
  b.appendChild(r);document.body.appendChild(b)};
})();
</script>
